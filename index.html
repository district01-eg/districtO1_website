<!-- كارت الهودي الأسود بتنسيق الموقع الأصلي -->
<div class="product-card" id="product-black" style="width: 100%; max-width: 480px; margin: 40px auto; text-align: left;">
    <div class="product-image" style="height: 460px; background: #e2edc5; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">
        <img id="black-product-img" src="black-front.png" alt="Faith Over Fear Hoodie - Black" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    </div>
    
    <!-- معلومات المنتج والأسعار -->
    <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: baseline;">
        <div>
            <h3 style="font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 4px;">Faith Over Fear Hoodie</h3>
            <p style="font-size: 12px; color: var(--muted);">Black - Graphic Hoodie</p>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: var(--ink);">650 EGP</div>
    </div>

    <!-- أزرار الوش والظهر -->
    <div class="view-switcher" style="display: flex; gap: 8px; margin-top: 12px;">
        <button class="view-btn active" onclick="switchBlackView('front', this)" style="background: var(--ink); color: var(--white); border: 1px solid var(--ink); padding: 8px 16px; font-size: 11px; cursor: pointer; text-transform: uppercase;">Front</button>
        <button class="view-btn" onclick="switchBlackView('back', this)" style="background: #f1f3f5; color: var(--ink); border: 1px solid var(--line); padding: 8px 16px; font-size: 11px; cursor: pointer; text-transform: uppercase;">Back</button>
    </div>
</div>

<!-- جافاسكريبت لتبديل الصور -->
<script>
    function switchBlackView(view, buttonElement) {
        let imgPath = `black-${view}.png`;
        document.getElementById('black-product-img').src = imgPath;

        let card = document.getElementById('product-black');
        card.querySelectorAll('.view-btn').forEach(btn => {
            btn.style.background = '#f1f3f5';
            btn.style.color = 'var(--ink)';
            btn.style.borderColor = 'var(--line)';
        });
        buttonElement.style.background = 'var(--ink)';
        buttonElement.style.color = 'var(--white)';
        buttonElement.style.borderColor = 'var(--ink)';
    }
</script>
